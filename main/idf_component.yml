dependencies:
  espressif/led_strip: ">=2.5.0"
  # No ESP-IDF 6.x o MQTT e o cJSON saíram do IDF e viraram componentes gerenciados.
  espressif/mqtt:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
  idf:
    version: ">=5.0"
